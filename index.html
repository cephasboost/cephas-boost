<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CEPHAS BOOST</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff}header{padding:20px;background:#111;text-align:center;border-bottom:2px solid #ff0050}.wrap{max-width:900px;margin:auto;padding:15px}.filters button{margin:5px;padding:8px 15px;border:0;border-radius:20px;cursor:pointer;background:#222;color:#fff}.filters button.active{background:#ff0050}.card{background:#1a1a1a;padding:15px;margin:10px 0;border-radius:12px;display:flex;justify-content:space-between;align-items:center}.card button{background:#ff0050;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer}.cart,.payment{background:#1e1e1e;padding:15px;border-radius:12px;margin-top:20px}.hidden{display:none}input{width:100%;padding:12px;border-radius:8px;border:0;margin:10px 0}.btn-pay{background:#25D366;color:#fff;padding:14px;width:100%;border:0;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}</style></head><body><header><h1>CEPHAS BOOST</h1><p>Boost TikTok, Instagram, YouTube - Lubumbashi</p></header><div class="wrap"><div class="filters" id="filters"></div><div id="list">Chargement...</div><section class="cart" id="cart"><h2>🛒 Votre commande</h2><div id="cart-content">Aucun service sélectionné</div><input id="userLink" placeholder="Collez votre lien TikTok / Insta / YouTube ici"></section><section class="payment" id="payment"><button class="btn-pay" onclick="startPayment()">Payer via WhatsApp - 0981482886</button><p style="text-align:center;font-size:13px;margin-top:10px">Orange Money / Airtel Money</p></section></div><script>let all=[],selected=null,platform="Tous";async function init(){try{let r=await fetch('./data.json');let j=await r.json();all=j.services||j;}catch(e){all=[]}renderFilters();render();}function renderFilters(){let ps=["Tous",...new Set(all.map(s=>s.category))];document.getElementById('filters').innerHTML=ps.map(p=>`<button class="${p===platform?'active':''}" onclick="setP('${p}')">${p}</button>`).join('');}function setP(p){platform=p;renderFilters();render();}function render(){let list=all.filter(s=>platform==="Tous"||s.category===platform);document.getElementById('list').innerHTML=list.map(s=>`<div class="card"><div><b>${s.name}</b><br><small>${s.category} - ${s.price} ${s.currency||'CDF'}</small></div><button onclick="choose(${s.id})">Choisir</button></div>`).join('')||"Aucun service";}function choose(id){selected=all.find(s=>s.id===id);document.getElementById('cart-content').innerHTML=`<b>${selected.name}</b><br>${selected.price} ${selected.currency||'CDF'}`;document.getElementById('payment').classList.remove('hidden');window.scrollTo(0,document.body.scrollHeight);}function startPayment(){if(!selected)return alert("Choisissez un service");let link=document.getElementById('userLink').value||"Pas de lien fourni";let msg=`Bonjour CEPHAS BOOST,%0AJe veux commander:%0A- ${selected.name}%0A- Prix: ${selected.price} CDF%0A- Mon lien: ${link}%0A%0AJe vais payer par Orange/Airtel Money.`;window.open(`https://wa.me/243981482886?text=${msg}`,'_blank');}init();</script></body></html>
